<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meetup Club - Event Platform</title>
    <meta name="description" content="The premier event platform for curated galas and private gatherings featuring real-time ticketing, manual UPI verification, and gate access." />
    <meta property="og:title" content="Meetup Club - Event Platform" />
    <meta property="og:description" content="The premier event platform for curated galas and private gatherings featuring real-time ticketing, manual UPI verification, and gate access." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // AI Studio Cloud Run proxy does not support or proxy Vite HMR websockets.
      // Intercept WebSocket creation for Vite HMR to prevent unhandled rejections and red error overlays.
      (function () {
        var OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          window.WebSocket = function (url, protocols) {
            var urlStr = String(url || '');
            var protoStr = String(protocols || '');
            if (
              urlStr.includes('vite-hmr') ||
              protoStr.includes('vite-hmr') ||
              urlStr.includes('@vite') ||
              urlStr.includes('run.app')
            ) {
              return {
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                readyState: 1, // OPEN
                url: urlStr,
                send: function () {},
                close: function () {},
                addEventListener: function (type, listener) {
                  if (type === 'open') {
                    setTimeout(function () {
                      try {
                        listener({ type: 'open' });
                      } catch (e) {}
                    }, 0);
                  }
                },
                removeEventListener: function () {},
                dispatchEvent: function () {
                  return true;
                },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
              };
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
        }

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          var msg = reason ? (reason.message || String(reason)) : '';
          if (
            msg.includes('WebSocket') ||
            msg.includes('websocket') ||
            msg.includes('closed without opened')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        var _origConsoleError = console.error;
        console.error = function () {
          var args = Array.prototype.slice.call(arguments);
          var first = String(args[0] || '');
          if (
            first.includes('[vite] failed to connect to websocket') ||
            first.includes('WebSocket closed without opened')
          ) {
            return;
          }
          _origConsoleError.apply(console, args);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
